services:
  - type: web
    name: lessonprep-api
    runtime: docker
    rootDir: backend/LessonPrep.Api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - key: Crypto__TokenSecret
        generateValue: true
      - key: Frontend__Origins__0
        sync: false
      - key: ReverseProxy__TrustAll
        value: "true"
      - key: ReverseProxy__ClientIpHeader
        value: CF-Connecting-IP
      - key: Ocr__WorkerCount
        value: "1"
